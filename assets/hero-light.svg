<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" fill="none" role="img" aria-label="Rangga Dwi Saputra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#57606a" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="48%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="880" height="132" rx="12" fill="url(#gridFade)"/>
    </mask>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="879" height="131" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="880" height="132" fill="url(#bg)"/>
    <rect x="0" y="0" width="880" height="132" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>

  <rect x="0.5" y="0.5" width="879" height="131" rx="12" stroke="#d0d7de" stroke-width="1"/>

  <rect x="34" y="28" width="26" height="3" rx="1.5" fill="#0969da"/>
  <text x="34" y="68" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.4">Rangga Dwi Saputra</text>
  <text x="34" y="97" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Just a regular developer who picks different languages depending on the project.</text>

  <rect x="720" y="42" width="126" height="28" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="783" y="60" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500">@ranggaggngntt</text>
</svg>
